services:
  minecraft:
    # NeoForge 1.21.1 needs Java 21; the untagged image may ship a newer Java.
    image: itzg/minecraft-server:java21
    container_name: mc-dungeons
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "1.21.1"
      MEMORY: ${MC_MEMORY:-8G}

      MODRINTH_PROJECTS: |
        when-dungeons-arise
        yungs-better-dungeons
        l_enders-cataclysm
        distanthorizons
      MODRINTH_DOWNLOAD_DEPENDENCIES: required

      # Only paid Java Edition accounts can join; no whitelist, anyone with the address gets in.
      ONLINE_MODE: "TRUE"
      OPS: ${MC_OPS:-}

      DIFFICULTY: hard
      MOTD: "Dungeons & Cataclysm"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "10"
      # Cataclysm bosses knock players into the air; without this the server kicks them for "flying".
      ALLOW_FLIGHT: "TRUE"
    volumes:
      - ./data:/data
    tty: true
    stdin_open: true

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: mc-playit
    restart: unless-stopped
    # Host networking lets the tunnel reach the server at 127.0.0.1:25565 (Linux only).
    network_mode: host
    environment:
      SECRET_KEY: ${PLAYIT_SECRET_KEY:?Falta PLAYIT_SECRET_KEY en el archivo .env}
    depends_on:
      - minecraft
